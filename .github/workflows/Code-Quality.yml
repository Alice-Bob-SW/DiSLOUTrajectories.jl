name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Aqua and JET / Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - name: Develop checkout in quality environment
        run: |
          julia --project=test/code-quality --startup-file=no -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
          '
      - name: Run Aqua and JET
        run: >-
          julia --code-coverage=@. --project=test/code-quality --startup-file=no
          test/junit.jl test/code-quality/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: junit.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
